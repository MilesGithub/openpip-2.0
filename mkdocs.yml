site_name: openPIP Documentation
site_description: >-
  Documentation for openPIP, the open-source platform for hosting, searching
  and visualising protein–protein interaction data.
repo_url: https://github.com/Helmy-Lab/openpip-2.0
repo_name: openpip-2.0
edit_uri: edit/main/docs/
copyright: >-
  openPIP is described in Helmy et al., <i>J. Mol. Biol.</i> 434 (2022) 167603.

docs_dir: docs
strict: true

# Working notes — plans, specs, audits, migration notes — live in docs/ next
# to the published pages because CLAUDE.md links to them there. They are not
# part of the product documentation, so the site leaves them out.
exclude_docs: |
  /*.md
  !/index.md
  /*.pdf
  /requirements.txt
  /project/
  /_hooks/
  /_overrides/

# Fills {{ portal_url }} in the pages and sets site_url from PUBLIC_URL.
hooks:
  - docs/_hooks/portal.py
  - docs/_hooks/help_layout.py

theme:
  name: material
  custom_dir: docs/_overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

# Dev notes: a blog of project write-ups (the GSoC report first). It is linked
# from the portal's About page rather than the docs' tabs.
plugins:
  - search
  - blog:
      blog_dir: dev-notes
      blog_toc: true
      post_url_format: "{slug}"

not_in_nav: |
  /dev-notes/

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/help.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - User guide:
      - Overview: user-guide/index.md
      - Searching and exploring networks: user-guide/searching.md
      - Browsing proteins: user-guide/proteins.md
      - Downloading data: user-guide/downloading.md
      - Accounts, saving and sharing: user-guide/accounts.md
  - Admin guide:
      - Overview: admin-guide/index.md
      - Settings: admin-guide/settings.md
      - News, datasets and files: admin-guide/content.md
  - Operator guide:
      - Installation: operator-guide/installation.md
      - Configuration reference: operator-guide/configuration.md
      - Data file formats: operator-guide/data-formats.md
      - Typed data format: operator-guide/typed-data-format.md
      - Typed releases: operator-guide/typed-releases.md
      - Maintenance: operator-guide/maintenance.md
      - Migrating from the original openPIP: operator-guide/migrating.md
  - Developer guide:
      - REST API:
          - Overview: developer/api/index.md
          - Authentication and accounts: developer/api/authentication.md
          - Proteins and search: developer/api/proteins-and-search.md
          - Datasets, downloads and uploads: developer/api/datasets.md
          - Saved networks and sharing: developer/api/sharing.md
          - Site settings and administration: developer/api/administration.md
          - Typed graph: developer/api/typed-graph.md
      - PSICQUIC service: developer/psicquic.md
  - About:
      - Citing openPIP: about/citation.md
      - License: about/license.md
