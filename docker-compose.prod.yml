# List-valued keys (ports, volumes) are merged with docker-compose.yml, not
# replaced, so every override below needs a !reset or !override tag. A plain
# `ports: []` once left Postgres and Redis published on every interface.
services:
  db:
    ports: !reset []

  redis:
    ports: !reset []

  frontend:
    build:
      args:
        # The app's base path and the docs' address are derived from it.
        PUBLIC_URL: ${PUBLIC_URL-}
    # Reached on this machine at http://localhost:8080, or through an HTTPS
    # proxy in front of it.
    ports: !override
      - "127.0.0.1:8080:80"

  backend:
    environment:
      DJANGO_SETTINGS_MODULE: openpip.settings.prod
      # Where the site is reached, e.g. https://openpip.example.org. Hosts,
      # trusted origins, the URL prefix and HTTPS all follow from it; leave it
      # unset for a local install at http://localhost:8080.
      PUBLIC_URL: ${PUBLIC_URL-}
      # Optional overrides; empty means "derive from PUBLIC_URL".
      ALLOWED_HOSTS: ${ALLOWED_HOSTS-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS-}
    ports: !override
      - "127.0.0.1:8001:8000"
    # !override: a plain list would be merged with the dev ./backend:/app
    # bind-mount, leaving prod running from the working tree.
    volumes: !override
      - media:/app/mediafiles
      # Typed release files (GRAPH_FILES_ROOT), never served.
      - graph_files:/app/graph_files
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py ensure_initial_data &&
             exec gunicorn openpip.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  celery:
    environment:
      DJANGO_SETTINGS_MODULE: openpip.settings.prod
    # !override: a plain list would be merged with the dev ./backend:/app
    # bind-mount, leaving prod running from the working tree.
    volumes: !override
      - media:/app/mediafiles
      - graph_files:/app/graph_files

volumes:
  media:
  graph_files:
